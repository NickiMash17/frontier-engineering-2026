<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CVE Reachability  - Investigation</title>
  <!--
    Sets data-theme on <html> synchronously, before the stylesheet below
    even needs to resolve any color -- avoids a flash of the wrong theme
    on load. Explicit choice (localStorage) wins; falls back to the
    system preference only when nothing has been chosen yet.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    This page must be served over http:// (e.g. `npx serve .` or
    `python -m http.server`, run from inside frontend/) -- it will NOT
    work if index.html is opened directly (file://). app.js below is an
    ES module, and browsers block ES module imports from file:// origins.
    See docs/FRONTEND_PLAN.md Section 1.
  -->
  <header id="app-header" class="app-header"></header>
  <div id="app-content" class="app-content" data-state="loading">
    <p class="mono" style="padding: var(--space-4);">Loading…</p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
